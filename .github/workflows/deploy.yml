name: Deploy Geronimo Coop to GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: logi-battle/package-lock.json
      - name: Install dependencies
        run: cd logi-battle && npm ci
      - name: Lint
        run: cd logi-battle && npm run lint
      - name: Tests
        run: cd logi-battle && npm test
      - name: Build
        # L'URL et la clé publishable Supabase sont publiques par conception
        # (présentes dans le bundle JS) — la sécurité repose sur les politiques RLS.
        env:
          VITE_DB_MODE: supabase
          VITE_SUPABASE_URL: https://zduojnjvjvdvrlhfmdip.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_OViYtCaiATp0H7tMEOGt_g_V1GCBp35
        run: cd logi-battle && npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './logi-battle/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
